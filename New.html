<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नवीनतम पोस्ट (Latest Posts) - काव्य सागर और कहानी</title>

  <!-- Global Language Switcher Script -->
  <script src="lang.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d0d15;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      width: 100%;
    }

    /* ---------------- HEADER ---------------- */
    header {
      background: rgba(30, 30, 47, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4a017;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .brand svg { width: 28px; height: 28px; flex-shrink: 0; }

    nav { display: flex; gap: 20px; }
    nav a {
      color: #9ca3af; text-decoration: none; font-size: 0.95rem; transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: #d4a017; }

    /* Dual Language Dropdown */
    .lang-dropdown-wrapper { position: relative; margin-right: 12px; }
    .lang-select {
      background: rgba(255, 255, 255, 0.05); border: 1px solid #d4a017; color: #d4a017;
      padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; outline: none; transition: all 0.2s ease; appearance: none;
      -webkit-appearance: none; padding-right: 28px;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23d4a017' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat; background-position: right 8px center;
    }
    .lang-select:hover { background-color: rgba(212, 160, 23, 0.15); }
    .lang-select option { background: #181824; color: #f3f4f6; }

    /* User Profile Menu */
    .user-profile-menu { position: relative; }
    .user-btn {
      display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 160, 23, 0.4); padding: 6px 12px; border-radius: 20px;
      color: #f3f4f6; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .user-btn:hover { background: rgba(212, 160, 23, 0.15); border-color: #d4a017; }
    .avatar-icon {
      width: 22px; height: 22px; background: #ffd700; color: #0d0d15; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75rem;
    }
    .avatar-icon.guest-avatar { background: #4b5563; color: #f3f4f6; }

    .dropdown-content {
      display: none; position: absolute; right: 0; top: 110%; background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; min-width: 150px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; z-index: 200;
    }
    .dropdown-content.show { display: block; }
    .dropdown-content a, .dropdown-content button {
      display: block; width: 100%; padding: 10px 14px; color: #d1d5db; text-decoration: none;
      background: none; border: none; text-align: left; font-size: 0.85rem; cursor: pointer;
    }
    .dropdown-content a:hover, .dropdown-content button:hover { background: rgba(212, 160, 23, 0.15); color: #d4a017; }

    /* ---------------- MAIN CONTAINER ---------------- */
    .latest-container {
      max-width: 1240px;
      margin: 35px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-main-title {
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 700;
    }

    .latest-card {
      width: 100%;
      background: #1e1e24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      min-height: 550px;
    }

    .category-pills-header {
      background: #23232c;
      padding: 16px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cat-pill {
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: #9ca3af;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cat-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.25), rgba(184, 134, 11, 0.4));
      color: #ffd700;
      border-color: #d4a017;
      box-shadow: 0 4px 12px rgba(212, 160, 23, 0.2);
    }

    .latest-body {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      overflow: hidden;
    }

    .item-list-column {
      background: #181820;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 480px;
    }

    .post-oval-item {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 35px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d1d5db;
    }

    .post-oval-item:hover {
      background: rgba(212, 160, 23, 0.1);
      border-color: rgba(212, 160, 23, 0.4);
      color: #ffffff;
      transform: translateX(4px);
    }

    .post-oval-item.active {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.2), rgba(120, 53, 15, 0.3));
      border-color: #d4a017;
      color: #ffd700;
      box-shadow: 0 4px 12px rgba(212, 160, 23, 0.15);
    }

    .item-title-text {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-column {
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #1b1b22;
      overflow-y: auto;
    }

    .viewer-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .author-heading {
      font-size: 1.3rem;
      color: #ffd700;
      font-weight: 600;
    }

    .post-main-title {
      font-size: 1.15rem;
      color: #ffffff;
      margin-top: 4px;
    }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 6px;
      transition: transform 0.2s;
    }
    .like-btn:hover { transform: scale(1.15); }
    .like-btn.liked svg { fill: #ff416c; stroke: #ff416c; color: #ff416c; }
    .like-btn svg {
      width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2;
    }

    .viewer-body-text {
      font-size: 1.1rem;
      line-height: 2;
      color: #d1d5db;
      white-space: pre-line;
      font-style: italic;
      background: rgba(255, 255, 255, 0.02);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 200px;
      margin-bottom: 25px;
      text-align: center;
    }

    .viewer-actions-bar {
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      flex-wrap: wrap;
    }

    .action-badge-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: rgba(212, 160, 23, 0.2);
      border-color: #d4a017;
      color: #ffffff;
    }

    /* ---------------- UNIVERSAL 4-CARD FOOTER ---------------- */
    .footer-section {
      max-width: 1240px; margin: 40px auto 0 auto; padding: 30px 20px 0 20px; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .footer-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 20px; text-align: center; text-decoration: none; color: #d1d5db; font-weight: 600; font-size: 1rem; transition: transform 0.2s, border-color 0.2s, background 0.2s; display: flex; align-items: center; justify-content: center; min-height: 80px;
    }
    .footer-card:hover { transform: translateY(-4px); border-color: rgba(212, 160, 23, 0.4); background: rgba(212, 160, 23, 0.05); color: #ffffff; }

    .other-links-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
    .other-links-btn {
      width: 100%; height: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #d1d5db; font-weight: 600; font-size: 1rem; cursor: pointer; min-height: 80px; transition: all 0.2s;
    }
    .other-links-btn:hover, .other-links-btn.active { border-color: #d4a017; color: #d4a017; background: rgba(212, 160, 23, 0.08); }

    .social-popup {
      position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; pointer-events: none; z-index: 50;
    }
    .social-popup.active { pointer-events: auto; }
    .social-circle {
      width: 50px; height: 50px; border-radius: 50%; background: #181824; border: 2px solid rgba(255, 255, 255, 0.15); display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; box-shadow: 0 10px 20px rgba(0,0,0,0.6); opacity: 0; transform: translateY(20px) scale(0.5); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .social-popup.active .social-circle { opacity: 1; transform: translateY(0) scale(1); }
    .social-popup.active .social-circle:nth-child(1) { transition-delay: 0.05s; }
    .social-popup.active .social-circle:nth-child(2) { transition-delay: 0.1s; }
    .social-popup.active .social-circle:nth-child(3) { transition-delay: 0.15s; }
    .social-circle.yt:hover { background: #ff0000; border-color: #ff0000; }
    .social-circle.fb:hover { background: #1877f2; border-color: #1877f2; }
    .social-circle.ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-color: #e6683c; }
    .social-circle svg { width: 24px; height: 24px; fill: currentColor; }

    footer { text-align: center; padding: 30px 20px; color: #6b7280; font-size: 0.85rem; }

    @media (max-width: 900px) {
      .latest-body { grid-template-columns: 1fr; }
      .item-list-column { max-height: 220px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      header { padding: 10px 15px; } nav { display: none; }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

  <!-- Main Latest Post Container -->
  <main class="latest-container">
    <h1 class="page-main-title" id="pageTitleHeading">नवीनतम पोस्ट (Latest Posts)</h1>

    <div class="latest-card">
      <!-- Top Category Pills Bar -->
      <div class="category-pills-header">
        <button class="cat-pill active" id="cat-kavita" onclick="switchCategory('kavita')">कविता (Poems)</button>
        <button class="cat-pill" id="cat-kahani" onclick="switchCategory('kahani')">कहानी (Stories)</button>
        <button class="cat-pill" id="cat-diary" onclick="switchCategory('diary')">डायरी (Diary)</button>
        <button class="cat-pill" id="cat-quotes" onclick="switchCategory('quotes')">प्रेरणादायक बातें (Quotes)</button>
      </div>

      <!-- Split Body Layout -->
      <div class="latest-body">
        <!-- Left Oval List Column -->
        <div class="item-list-column" id="itemListColumn"></div>

        <!-- Right Viewer Column -->
        <div class="viewer-column">
          <div class="viewer-top-row">
            <div>

              <div class="post-main-title" id="viewTitle">Post Title</div>
            </div>
            <button class="like-btn" onclick="handleProtectedLike(this)" title="Like Post">
              <svg viewBox="0 0 24 24">

              </svg>
            </button>
          </div>

          <div class="viewer-body-text" id="viewBody">Post content goes here...</div>

          <!-- Bottom Action Bar -->
          <div class="viewer-actions-bar">
            <button class="action-badge-btn" onclick="handleProtectedAction('Save')">🔖 <span data-lang-key="btnSave">सहेजें (Save)</span></button>
            <button class="action-badge-btn" onclick="handleShareAction()">🔗 <span data-lang-key="btnShare">साझा करें (Share)</span></button>
            <button class="action-badge-btn" onclick="handleCommentAction()">💬 <span data-lang-key="btnComment">टिप्पणी (Comment)</span></button>
          </div>
        </div>
      </div>
    </div>
  </main>

      <a href="terms.html" class="footer-card" data-lang-key="termsConditions">Terms and Conditions</a>

      <div class="other-links-wrapper">
        <button class="other-links-btn" id="otherLinksBtn" data-lang-key="otherLinks">Other Links</button>

        <div class="social-popup" id="socialPopup">
          <a href="https://www.youtube.com/@KavyaSagarorKahani" target="_blank" class="social-circle yt" title="YouTube">

        {
          id: "tp1",
          hi: { title: "कहानी 1 - चालाक लोमड़ी", author: "~ Dubey", body: "एक भूखी लोमड़ी भोजन की तलाश में जंगल में भटक रही थी...\nकौए और लोमड़ी की यह पुरानी कहानी सदा सीख देती है।" },
          en: { title: "Story 1 - The Cunning Fox", author: "~ Dubey", body: "A hungry fox was wandering through the forest in search of food...\nThis classic tale of the crow and fox teaches a timeless moral." }
        }
      ],
      diary: [
        {
          id: "dp1",
          hi: { title: "डायरी 1 - शांत सुबह", author: "~ कुमार", body: "आज सुबह बालकनी में चाय पीते हुए महसूस हुआ\nकि जीवन की असली ख़ुशी सादगी में है।" },
          en: { title: "Diary 1 - Peaceful Morning", author: "~ Kumar", body: "Sipping tea on the balcony this morning made me realize\nthat true joy in life resides in simplicity." }
        }
      ],
      quotes: [
        {
          id: "qp1",
          hi: { title: "प्रेरणा 1 - कड़ी मेहनत", author: "~ कुमार", body: "“मेहनत करने वालों की कभी हार नहीं होती।”" },
          en: { title: "Inspiration 1 - Hard Work", author: "~ Kumar", body: "“Those who put in hard work never face defeat.”" }
        }
      ]
    };

    let activeCategory = 'kavita';
    let selectedPostId = null;

    function switchCategory(catKey) {
      activeCategory = catKey;
      selectedPostId = null;

      document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
      document.getElementById(`cat-${catKey}`).classList.add('active');

      renderPostList();
    }

    function renderPostList() {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = localDict[currentLang] || localDict.hi;

      document.getElementById('pageTitleHeading').innerText = dict.pageTitleHeading;
      document.getElementById('cat-kavita').innerText = dict.catKavita;
      document.getElementById('cat-kahani').innerText = dict.catKahani;
      document.getElementById('cat-diary').innerText = dict.catDiary;
      document.getElementById('cat-quotes').innerText = dict.catQuotes;

      const posts = latestPostsDatabase[activeCategory] || [];
      const listContainer = document.getElementById('itemListColumn');
      listContainer.innerHTML = '';

      if (posts.length === 0) {
        listContainer.innerHTML = `<p style="color:#6b7280; font-size:0.85rem; text-align:center; padding:20px 5px;">No posts available.</p>`;
        return;
      }

      if (!selectedPostId && posts.length > 0) {
        selectedPostId = posts[0].id;
      }

      posts.forEach(post => {
        const content = post[currentLang] || post.hi;
        const oval = document.createElement('div');
        oval.className = `post-oval-item ${post.id === selectedPostId ? 'active' : ''}`;
        oval.onclick = () => selectPost(post.id);

        oval.innerHTML = `
          <span class="item-title-text">${content.title}</span>
          <span style="color:#d4a017; font-size:0.8rem;">›</span>
        `;
        listContainer.appendChild(oval);
      });

      const currentPost = posts.find(p => p.id === selectedPostId) || posts[0];
      if (currentPost) {
        loadPostToViewer(currentPost);
      }
    }

    function selectPost(id) {
      selectedPostId = id;
      const posts = latestPostsDatabase[activeCategory] || [];
      const post = posts.find(p => p.id === id);

      document.querySelectorAll('.post-oval-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      if (post) {
        loadPostToViewer(post);
      }
    }

    function loadPostToViewer(post) {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const content = post[currentLang] || post.hi;

      document.getElementById('viewAuthor').innerText = content.author;
      document.getElementById('viewTitle').innerText = content.title;
      document.getElementById('viewBody').innerText = content.body;
    }

    // --- AUTH HEADER & LOGOUT ---
    function renderAuthHeader() {
      const container = document.getElementById('userAuthContainer');
      if (!container) return;

      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      const currentLang = localStorage.getItem('site_lang') || 'hi';

      if (isLoggedIn) {
        const rawName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || 'Admin';
        const userName = rawName.trim();
        const userInitial = userName.charAt(0).toUpperCase() || 'A';

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn" onclick="toggleUserDropdown(event)">
            <span class="avatar-icon">${userInitial}</span>
            <span>${userName}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="profile.html" data-lang-key="myProfile">My Profile</a>
            <a href="saved-items.html" data-lang-key="savedItems">Saved Items</a>
            <a href="my-works.html" data-lang-key="myWorks">My Works</a>
            <a href="mailto:official.ksok@gmail.com" data-lang-key="contactUs">Contact us</a>
            <button onclick="handleUserLogout()" data-lang-key="logout">Logout</button>
          </div>
        `;
      } else {
        const guestLabel = currentLang === 'hi' ? 'अतिथि (Guest)' : 'Guest';
        const signInLabel = currentLang === 'hi' ? 'साइन इन करें' : 'Sign In';

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn" onclick="toggleUserDropdown(event)">
            <span class="avatar-icon guest-avatar">G</span>
            <span>${guestLabel}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="login.html" style="color:#d4a017; font-weight:600;">🔑 ${signInLabel}</a>
            <a href="mailto:official.ksok@gmail.com" data-lang-key="contactUs">Contact us</a>
          </div>
        `;
      }
    }

    function toggleUserDropdown(event) {
      event.stopPropagation();
      const dropdown = document.getElementById('userDropdown');
      if (dropdown) dropdown.classList.toggle('show');
    }

    function handleUserLogout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userName');
      sessionStorage.clear();
      window.location.reload();
    }

    function handleProtectedLike(btn) {
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        alert('Please log in to like this post.');
        window.location.href = 'login.html';
        return;
      }
      btn.classList.toggle('liked');
    }

    function handleProtectedAction(actionName) {
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        alert('Please log in to save items.');
        window.location.href = 'login.html';
        return;
      }
      alert(`Post ${actionName} successfully!`);
    }

    function handleShareAction() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert('Post link copied to clipboard!');
      } else {
        alert('Share triggered!');
      }
    }

    function handleCommentAction() {
      alert('Comments section opening soon!');
    }

    window.addEventListener('click', (e) => {
      const userDropdown = document.getElementById('userDropdown');
      const userMenuBtn = document.getElementById('userMenuBtn');
      if (userDropdown && userMenuBtn && !userMenuBtn.contains(e.target)) {
        userDropdown.classList.remove('show');
      }
    });

    window.addEventListener('languageChanged', () => {
      renderAuthHeader();
      renderPostList();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAuthHeader();
      renderPostList();
    });
  </script>

</body>
</html>
