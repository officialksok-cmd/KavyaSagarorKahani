<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - काव्य सागर और कहानी</title>
  
  <script src="lang.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #1e1e2f 0%, #0d0d15 100%);
      color: #f3f4f6;
      overflow-x: hidden;
      width: 100%;
    }

    .wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      width: 100%;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    /* Top Corner Language Selector inside Card */
    .card-lang-wrapper {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 10;
    }

    .lang-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid #d4a017;
      color: #d4a017;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23d4a017' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
    }

    .lang-select:hover {
      background-color: rgba(212, 160, 23, 0.15);
    }

    .lang-select option {
      background: #181824;
      color: #f3f4f6;
    }

    /* Left Side Branding */
    .brand-section {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.15) 0%, rgba(120, 53, 15, 0.2) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .logo-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      color: #d4a017;
      filter: drop-shadow(0 4px 12px rgba(212, 160, 23, 0.3));
    }

    .brand-title {
      color: #f3f4f6;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    /* Right Side Reset Box */
    .reset-section {
      flex: 1.1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(18, 18, 26, 0.6);
    }

    .reset-header {
      margin-bottom: 24px;
    }

    .reset-header h2 {
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .reset-header p {
      color: #9ca3af;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #d1d5db;
      font-size: 0.875rem;
      margin-bottom: 6px;
    }

    .input-with-action {
      display: flex;
      gap: 10px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #d4a017;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.2);
    }

    .btn-action-inline {
      background: rgba(212, 160, 23, 0.15);
      border: 1px solid #d4a017;
      color: #d4a017;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-action-inline:hover {
      background: #d4a017;
      color: #0d0d15;
    }

    .divider-or {
      text-align: center;
      margin: 12px 0;
      color: #9ca3af;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-reset {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #d4a017 0%, #b8860b 100%);
      color: #0d0d15;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-reset:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212, 160, 23, 0.4);
    }

    .back-to-login {
      text-align: center;
      font-size: 0.875rem;
      margin-top: 16px;
    }

    .back-to-login a {
      color: #d4a017;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    /* ---------------- UNIVERSAL 4-CARD FOOTER SECTION ---------------- */
    .footer-section {
      max-width: 1200px;
      margin: 20px auto 0 auto;
      padding: 30px 16px 0 16px;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .footer-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      text-decoration: none;
      color: #d1d5db;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    .footer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 160, 23, 0.4);
      background: rgba(212, 160, 23, 0.05);
      color: #ffffff;
    }

    .other-links-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .other-links-btn {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #d1d5db;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      min-height: 80px;
      transition: all 0.2s;
    }

    .other-links-btn:hover, .other-links-btn.active {
      border-color: #d4a017;
      color: #d4a017;
      background: rgba(212, 160, 23, 0.08);
    }

    .social-popup {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      pointer-events: none;
      z-index: 50;
    }

    .social-popup.active {
      pointer-events: auto;
    }

    .social-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #181824;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(20px) scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .social-popup.active .social-circle {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .social-popup.active .social-circle:nth-child(1) { transition-delay: 0.05s; }
    .social-popup.active .social-circle:nth-child(2) { transition-delay: 0.10s; }
    .social-popup.active .social-circle:nth-child(3) { transition-delay: 0.15s; }

    .social-circle.yt:hover { background: #ff0000; border-color: #ff0000; }
    .social-circle.fb:hover { background: #1877f2; border-color: #1877f2; }
    .social-circle.ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-color: #e6683c; }

    .social-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6b7280;
      font-size: 0.85rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .brand-section {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 40px 20px;
      }
      .reset-section {
        padding: 40px 20px;
      }
      .card-lang-wrapper {
        top: 12px;
        right: 15px;
      }
      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="container">
      
      <div class="card-lang-wrapper">
        <select id="globalLangSelect" class="lang-select" onchange="applyLanguage(this.value)">
          <option value="hi">हिन्दी</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="brand-section">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M48 6C36 12 24 24 18 42L14 54l12-4c18-6 30-18 36-30-4 0-10 2-14 6" />
          <path d="M22 38l16-16" />
          <path d="M12 44c-3 1-6 4-6 7 0 4 4 7 8 7h14c6 0 10-4 12-8l4-8" stroke-width="1.8" />
          <path d="M18 42c0-2 2-4 4-4s4 2 4 4" stroke-width="1.8" />
        </svg>
        <h1 class="brand-title" data-lang-key="brandTitle">काव्य सागर और कहानी</h1>
      </div>

      <div class="reset-section">
        <div class="reset-header">
          <h2 id="resetHeading">पासवर्ड रीसेट करें (Reset Password)</h2>
          <p id="resetSubtext">अपने खाते को पुनर्प्राप्त करने के लिए ईमेल या मोबाइल नंबर का उपयोग करें।</p>
        </div>

        <form id="resetForm" action="#" method="POST">
          <div class="form-group">
            <label for="reset-email" id="labelResetEmail">ईमेल पता (Email Address)</label>
            <div class="input-with-action">
              <input type="email" id="reset-email" name="email" placeholder="Enter your registered email">
              <button type="button" class="btn-action-inline" id="sendEmailOtpBtn" data-lang-key="sendEmailOtp">Send OTP on mail</button>
            </div>
          </div>

          <div class="divider-or" data-lang-key="orDivider">or</div>

          <div class="form-group">
            <label for="reset-phone" id="labelResetPhone">मोबाइल नंबर (Phone Number)</label>
            <div class="input-with-action">
              <input type="tel" id="reset-phone" name="phone" placeholder="Enter 10-digit mobile number">
              <button type="button" class="btn-action-inline" id="sendPhoneOtpBtn" data-lang-key="sendPhoneOtp">Send OTP</button>
            </div>
          </div>

          <div class="form-group" id="otpSection" style="display: none;">
            <label for="otp-input" id="labelEnterOtp">ओटीपी दर्ज करें (Enter OTP)</label>
            <input type="text" id="otp-input" placeholder="Enter 6-digit verification code" maxlength="6">
          </div>

          <div class="form-group" id="newPassSection" style="display: none;">
            <label for="new-password" id="labelNewPass">नया पासवर्ड (New Password)</label>
            <input type="password" id="new-password" placeholder="Enter new password">
          </div>

          <button type="submit" class="btn-reset" id="submitBtn" data-lang-key="proceedBtn">आगे बढ़ें (Proceed)</button>

          <div class="back-to-login">
            <a href="login.html" id="backToSignIn">← साइन इन पर वापस जाएं (Back to Sign In)</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <section class="footer-section">
    <div class="footer-grid">
      <a href="about-us.html" class="footer-card" data-lang-key="aboutUs">About us</a>
      <a href="privacy-policy.html" class="footer-card" data-lang-key="privacyPolicy">Privacy Policy</a>
      <a href="terms.html" class="footer-card" data-lang-key="termsConditions">Terms and Conditions</a>

      <div class="other-links-wrapper">
        <button class="other-links-btn" id="otherLinksBtn" data-lang-key="otherLinks">Other Links</button>

        <div class="social-popup" id="socialPopup">
          <a href="https://www.youtube.com/@KavyaSagarorKahani" target="_blank" class="social-circle yt" title="YouTube">
            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </a>
          <a href="https://facebook.com" target="_blank" class="social-circle fb" title="Facebook">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <a href="https://instagram.com" target="_blank" class="social-circle ig" title="Instagram">

          </a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 काव्य सागर और कहानी. All rights reserved.
  </footer>

  <script>
    // --- 1. LOCAL TRANSLATION DICTIONARY FOR FORGET PASSWORD ---
    const forgetTranslations = {
      hi: {
        resetHeading: "पासवर्ड रीसेट करें (Reset Password)",
        resetSubtext: "अपने खाते को पुनर्प्राप्त करने के लिए ईमेल या मोबाइल नंबर का उपयोग करें।",
        labelResetEmail: "ईमेल पता (Email Address)",
        sendEmailOtpBtn: "Send OTP on mail",
        orDivider: "or",
        labelResetPhone: "मोबाइल नंबर (Phone Number)",
        sendPhoneOtpBtn: "Send OTP",
        labelEnterOtp: "ओटीपी दर्ज करें (Enter OTP)",
        labelNewPass: "नया पासवर्ड (New Password)",
        proceedBtn: "आगे बढ़ें (Proceed)",
        backToSignIn: "← साइन इन पर वापस जाएं (Back to Sign In)"
      },
      en: {
        resetHeading: "Reset Password",
        resetSubtext: "Choose a recovery method via Email or Phone Number to reset your password.",
        labelResetEmail: "Email Address",
        sendEmailOtpBtn: "Send OTP on mail",
        orDivider: "or",
        labelResetPhone: "Phone Number",
        sendPhoneOtpBtn: "Send OTP",
        labelEnterOtp: "Enter OTP",
        labelNewPass: "New Password",
        proceedBtn: "Proceed",
        backToSignIn: "← Back to Sign In"
      }
    };

    function updateForgetLanguage() {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = forgetTranslations[currentLang] || forgetTranslations.hi;

      for (const [id, text] of Object.entries(dict)) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
      }

      // Sync language selector dropdown value
      const langSelect = document.getElementById('globalLangSelect');
      if (langSelect) {
        langSelect.value = currentLang;
      }
    }

    let otpSent = false;
    let otpVerified = false;

    // Send Mail OTP
    document.getElementById('sendEmailOtpBtn').addEventListener('click', () => {
      const email = document.getElementById('reset-email').value.trim();
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      if (!email) {
        alert(currentLang === 'hi' ? 'कृपया पहले अपना ईमेल दर्ज करें।' : 'Please enter your email address first.');
        return;
      }
      otpSent = true;
      alert(currentLang === 'hi' ? `OTP ईमेल ${email} पर सफलतापूर्वक भेज दिया गया है!` : `OTP sent successfully to email: ${email}`);
      document.getElementById('otpSection').style.display = 'block';
      document.getElementById('submitBtn').innerText = currentLang === 'hi' ? 'OTP सत्यापित करें (Verify OTP)' : 'Verify OTP';
    });

    // Send Phone OTP
    document.getElementById('sendPhoneOtpBtn').addEventListener('click', () => {
      const phone = document.getElementById('reset-phone').value.trim();
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      if (!phone || phone.length < 10) {
        alert(currentLang === 'hi' ? 'कृपया वैध 10-अंकों का मोबाइल नंबर दर्ज करें।' : 'Please enter a valid 10-digit phone number first.');
        return;
      }
      otpSent = true;
      alert(currentLang === 'hi' ? `OTP मोबाइल नंबर ${phone} पर भेज दिया गया है!` : `OTP sent successfully to phone: ${phone}`);
      document.getElementById('otpSection').style.display = 'block';
      document.getElementById('submitBtn').innerText = currentLang === 'hi' ? 'OTP सत्यापित करें (Verify OTP)' : 'Verify OTP';
    });

    // Form submission handling flow: Send OTP -> Verify OTP -> Reset Password
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const currentLang = localStorage.getItem('site_lang') || 'hi';

      if (!otpSent) {
        alert(currentLang === 'hi' ? 'कृपया पहले "Send OTP on mail" या "Send OTP" पर क्लिक करें।' : 'Please click "Send OTP on mail" or "Send OTP" first.');
        return;
      }

      const otpVal = document.getElementById('otp-input').value.trim();

      if (!otpVerified) {
        if (!otpVal || otpVal.length < 4) {
          alert(currentLang === 'hi' ? 'कृपया प्राप्त सही OTP दर्ज करें।' : 'Please enter the valid OTP received.');
          return;
        }
        // Mock verification success
        otpVerified = true;
        alert(currentLang === 'hi' ? 'OTP सफलतापूर्वक सत्यापित हो गया! कृपया अपना नया पासवर्ड दर्ज करें।' : 'OTP verified successfully! Please enter your new password.');
        document.getElementById('otpSection').style.display = 'none';
        document.getElementById('newPassSection').style.display = 'block';
        document.getElementById('submitBtn').innerText = currentLang === 'hi' ? 'पासवर्ड रीसेट करें (Reset Password)' : 'Reset Password';
        return;
      }

      // Final step: Password Reset
      const newPass = document.getElementById('new-password').value;
      if (!newPass || newPass.length < 6) {
        alert(currentLang === 'hi' ? 'पासवर्ड कम से कम 6 अक्षर का होना चाहिए।' : 'Password must be at least 6 characters long.');
        return;
      }

      alert(currentLang === 'hi' ? 'पासवर्ड सफलतापूर्वक बदल दिया गया है! लॉगिन पर रीडायरेक्ट किया जा रहा है...' : 'Password has been reset successfully! Redirecting to login...');
      window.location.href = 'login.html';
    });

    // Footer Other Links Popup script handling
    const otherLinksBtn = document.getElementById('otherLinksBtn');
    const socialPopup = document.getElementById('socialPopup');

    otherLinksBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isActive = socialPopup.classList.toggle('active');
      otherLinksBtn.classList.toggle('active');
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
      if (dict) {
        otherLinksBtn.innerText = isActive ? dict.close : dict.otherLinks;
      } else {
        otherLinksBtn.innerText = isActive ? '✕ Close' : 'Other Links';
      }
    });

    window.addEventListener('click', (e) => {
      if (!otherLinksBtn.contains(e.target) && !socialPopup.contains(e.target)) {
        socialPopup.classList.remove('active');
        otherLinksBtn.classList.remove('active');
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
        otherLinksBtn.innerText = dict ? dict.otherLinks : 'Other Links';
      }
    });

    // Language change real-time listener
    window.addEventListener('languageChanged', updateForgetLanguage);
    window.addEventListener('DOMContentLoaded', updateForgetLanguage);
  </script>

</body>
</html>
