<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कविताएँ - काव्य सागर और कहानी</title>

  <!-- Global Language Switcher Script -->
  <script src="lang.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d0d15;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      width: 100%;
    }

    /* ---------------- HEADER ---------------- */
    header {
      background: rgba(30, 30, 47, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4a017;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .brand svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: #d4a017;
    }

    /* Dual Language Dropdown */
    .lang-dropdown-wrapper {
      position: relative;
      margin-right: 12px;
    }

    .lang-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #d4a017;
      color: #d4a017;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23d4a017' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
    }

    .lang-select:hover {
      background-color: rgba(212, 160, 23, 0.15);
    }

    .lang-select option {
      background: #181824;
      color: #f3f4f6;
    }

    /* User Profile Dropdown Menu */
    .user-profile-menu {
      position: relative;
    }

    .user-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 160, 23, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      color: #f3f4f6;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .user-btn:hover {
      background: rgba(212, 160, 23, 0.15);
      border-color: #d4a017;
    }

    .avatar-icon {
      width: 22px;
      height: 22px;
      background: #ffd700;
      color: #0d0d15;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .avatar-icon.guest-avatar {
      background: #4b5563;
      color: #f3f4f6;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      min-width: 150px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow: hidden;
      z-index: 200;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content a, .dropdown-content button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      color: #d1d5db;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .dropdown-content a:hover, .dropdown-content button:hover {
      background: rgba(212, 160, 23, 0.15);
      color: #d4a017;
    }

    /* ---------------- MAIN CONTAINER ---------------- */
    .poems-container {
      max-width: 1240px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 30px;
      flex: 1;
      align-items: start;
    }

    /* Left Sidebar: Fixed Category Panel */
    .category-card {
      background: #15151f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px 18px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    .category-card h2 {
      font-size: 1.1rem;
      color: #d4a017;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .category-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-item {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 25px;
      color: #d1d5db;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      text-align: center;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .category-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      transform: translateX(3px);
    }

    /* Active Category Glow Themes */
    .category-item[data-theme="love"].active { background: linear-gradient(135deg, #ff4b2b, #ff416c); color: #fff; border-color: #ff416c; box-shadow: 0 4px 15px rgba(255, 65, 108, 0.35); }
    .category-item[data-theme="friendship"].active { background: linear-gradient(135deg, #00b4db, #0083b0); color: #fff; border-color: #00b4db; box-shadow: 0 4px 15px rgba(0, 180, 219, 0.35); }
    .category-item[data-theme="nature"].active { background: linear-gradient(135deg, #a8ff78, #78ffd6); color: #0d0d15; border-color: #a8ff78; box-shadow: 0 4px 15px rgba(168, 255, 120, 0.35); }
    .category-item[data-theme="religious"].active { background: linear-gradient(135deg, #ff9966, #ff5e62); color: #fff; border-color: #ff9966; box-shadow: 0 4px 15px rgba(255, 153, 102, 0.35); }
    .category-item[data-theme="sad"].active { background: linear-gradient(135deg, #4b6cb7, #182848); color: #fff; border-color: #4b6cb7; box-shadow: 0 4px 15px rgba(75, 108, 183, 0.35); }

    /* ---------------- NATIVE 3D CARD CAROUSEL ---------------- */
    .custom-carousel-box {
      background: #15151f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 35px 20px 25px 20px;
      width: 100%;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .card-deck-stage {
      position: relative;
      width: 100%;
      height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .custom-slide-card {
      position: absolute;
      width: 350px;
      max-width: 85%;
      min-height: 290px;
      background: #1a1a26;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease, box-shadow 0.45s ease, border-color 0.45s ease;
      cursor: pointer;
      user-select: none;
    }

    /* CARD POSITION STATES */
    /* 1. Center Active */
    .custom-slide-card.active {
      transform: translateX(0) scale(1) translateZ(50px);
      opacity: 1;
      z-index: 10;
      cursor: default;
    }

    /* 2. Left Inactive Card */
    .custom-slide-card.prev {
      transform: translateX(-190px) scale(0.84) rotateY(8deg);
      opacity: 0.32;
      z-index: 5;
      filter: blur(0.5px);
    }

    /* 3. Right Inactive Card */
    .custom-slide-card.next {
      transform: translateX(190px) scale(0.84) rotateY(-8deg);
      opacity: 0.32;
      z-index: 5;
      filter: blur(0.5px);
    }

    /* 4. Hidden Far Left/Right */
    .custom-slide-card.hidden-left {
      transform: translateX(-320px) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .custom-slide-card.hidden-right {
      transform: translateX(320px) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* THEME ACTIVE GLOWS */
    .custom-slide-card.active.theme-love {
      background: linear-gradient(145deg, rgba(255, 65, 108, 0.22), rgba(24, 24, 34, 0.98));
      border-color: #ff416c;
      box-shadow: 0 0 35px rgba(255, 65, 108, 0.45);
    }
    .custom-slide-card.active.theme-friendship {
      background: linear-gradient(145deg, rgba(0, 180, 219, 0.22), rgba(24, 24, 34, 0.98));
      border-color: #00b4db;
      box-shadow: 0 0 35px rgba(0, 180, 219, 0.45);
    }
    .custom-slide-card.active.theme-nature {
      background: linear-gradient(145deg, rgba(168, 255, 120, 0.22), rgba(24, 24, 34, 0.98));
      border-color: #a8ff78;
      box-shadow: 0 0 35px rgba(168, 255, 120, 0.45);
    }
    .custom-slide-card.active.theme-religious {
      background: linear-gradient(145deg, rgba(255, 153, 102, 0.22), rgba(24, 24, 34, 0.98));
      border-color: #ff9966;
      box-shadow: 0 0 35px rgba(255, 153, 102, 0.45);
    }
    .custom-slide-card.active.theme-sad {
      background: linear-gradient(145deg, rgba(75, 108, 183, 0.22), rgba(24, 24, 34, 0.98));
      border-color: #4b6cb7;
      box-shadow: 0 0 35px rgba(75, 108, 183, 0.45);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-header-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 4px;
      transition: transform 0.2s;
    }

    .like-btn:hover { transform: scale(1.2); }
    .like-btn.liked svg { fill: #ff416c; stroke: #ff416c; color: #ff416c; }

    .like-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .shayari-content {
      font-size: 1.12rem;
      line-height: 1.85;
      text-align: center;
      min-height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line;
      color: #ffffff;
      font-style: italic;
      padding: 10px 0;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #d4a017;
      color: #0e0e14;
      border-color: #d4a017;
    }

    /* Slider Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 20px;
      z-index: 20;
    }

    .nav-arrow {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-arrow:hover {
      background: #d4a017;
      color: #0d0d15;
      border-color: #d4a017;
      transform: scale(1.08);
    }

    .counter {
      font-size: 0.95rem;
      font-weight: 600;
      color: #9ca3af;
      min-width: 60px;
      text-align: center;
    }

    /* ---------------- UNIVERSAL 4-CARD FOOTER ---------------- */
    .footer-section {
      max-width: 1240px;
      margin: 40px auto 0 auto;
      padding: 30px 20px 0 20px;
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .footer-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      text-decoration: none;
      color: #d1d5db;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    .footer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 160, 23, 0.4);
      background: rgba(212, 160, 23, 0.05);
      color: #ffffff;
    }

    .other-links-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .other-links-btn {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #d1d5db;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      min-height: 80px;
      transition: all 0.2s;
    }

    .other-links-btn:hover, .other-links-btn.active {
      border-color: #d4a017;
      color: #d4a017;
      background: rgba(212, 160, 23, 0.08);
    }

    .social-popup {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      pointer-events: none;
      z-index: 50;
    }

    .social-popup.active {
      pointer-events: auto;
    }

    .social-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #181824;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(20px) scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .social-popup.active .social-circle {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .social-popup.active .social-circle:nth-child(1) { transition-delay: 0.05s; }
    .social-popup.active .social-circle:nth-child(2) { transition-delay: 0.1s; }
    .social-popup.active .social-circle:nth-child(3) { transition-delay: 0.15s; }

    .social-circle.yt:hover { background: #ff0000; border-color: #ff0000; }
    .social-circle.fb:hover { background: #1877f2; border-color: #1877f2; }
    .social-circle.ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-color: #e6683c; }

    .social-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6b7280;
      font-size: 0.85rem;
    }

    @media (max-width: 900px) {
      .poems-container {
        grid-template-columns: 1fr;
      }
      .category-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      header { padding: 10px 15px; } nav { display: none; }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

  <header>

          <option value="en">English</option>
        </select>
      </div>

      <div class="user-profile-menu" id="userAuthContainer"></div>

  </header>

  <!-- Main Container -->
  <main class="poems-container">

    <div class="category-card">
      <h2 data-lang-key="categoriesHeading">श्रेणियाँ (Categories)</h2>
      <ul class="category-list">
        <li class="category-item active" data-theme="love" onclick="selectCategory('love', this)" data-lang-key="catLove">Love (प्रेम)</li>
        <li class="category-item" data-theme="friendship" onclick="selectCategory('friendship', this)" data-lang-key="catFriendship">Friendship (दोस्ती)</li>
        <li class="category-item" data-theme="nature" onclick="selectCategory('nature', this)" data-lang-key="catNature">Nature (प्रकृति)</li>
        <li class="category-item" data-theme="religious" onclick="selectCategory('religious', this)" data-lang-key="catReligious">Religious (भक्ति)</li>

    <!-- Right Contained Card Stage -->
    <div class="custom-carousel-box">

      <!-- Controls -->
      <div class="controls">
        <button class="nav-arrow" onclick="navigateDeck(-1)" id="prevBtn">&lt;</button>

      </div>
    </div>
  </main>

  <section class="footer-section">

        <button class="other-links-btn" id="otherLinksBtn" data-lang-key="otherLinks">Other Links</button>

        <div class="social-popup" id="socialPopup">

          </a>
          <a href="https://instagram.com" target="_blank" class="social-circle ig" title="Instagram">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 काव्य सागर और कहानी. All rights reserved.
  </footer>

  <script>
    const poemsMultilingualData = {
      love: {
        themeClass: "theme-love",
        titles: { hi: "प्रेम शायरी", en: "Love Poetry" },
        items: {
          hi: [
            "तेरे नाम से जुड़ी हर शाम सुहानी लगती है,\nतेरी मुस्कुराहट ही मेरी ज़िंदगानी लगती है।",
            "दिल की धड़कन बनकर तुम समाए हो,\nसांसों में महक बनकर तुम छाए हो।",
            "मोहब्बत नाम है जिसका, वो इक हंसीं अहसास है,\nजो दूर रहकर भी हर लम्हा हमारे पास है।"
          ],
          en: [
            "Every evening linked with your name feels pleasant,\nYour warm smile alone feels like my whole life.",
            "You dwell within me as the beat of my heart,\nYou surround me like a fragrance in every breath.",
            "Love is that pure and beautiful emotion,\nWhich stays close to the heart even across distances."
          ]
        }
      },
      friendship: {
        themeClass: "theme-friendship",
        titles: { hi: "दोस्ती शायरी", en: "Friendship Poetry" },
        items: {
          hi: [
            "दोस्ती नाम है सुख-दुख की कहानी का,\nदोस्ती राज़ है सदा मुस्कुराने का।",
            "सच्चा दोस्त वही जो बिना कहे बात समझ ले,\nहर मुश्किल राह में हाथ थाम ले।"
          ],
          en: [
            "Friendship is the story of shared joys and sorrows,\nFriendship is the secret to smiling through everything.",
            "A true friend understands without needing words,\nAnd holds your hand through every tough road."
          ]
        }
      },
      nature: {
        themeClass: "theme-nature",
        titles: { hi: "प्रकृति कविता", en: "Nature Poetry" },
        items: {
          hi: [
            "हरियाली की चादर ओढ़े धरती मुस्काती है,\nसुबह की पहली किरण नया सवेरा लाती है।",
            "नदियों का बहना, हवाओं का चलना,\nप्रकृति सिखाती है हर हाल में ढलना।"
          ],
          en: [
            "Draped in lush green, the earth smiles with grace,\nThe first morning ray brings a new beginning to embrace.",
            "Flowing rivers and gentle winds that softly pass,\nNature teaches us resilience in every circumstance."
          ]
        }
      },
      religious: {
        themeClass: "theme-religious",
        titles: { hi: "भक्ति शायरी", en: "Devotional Poetry" },
        items: {
          hi: [
            "ईश्वर का वास तो हर कण में समाया है,\nजिसने सच्चा भाव रखा, उसने ही पाया है।",
            "मन में भक्ति और होठों पर तेरा नाम,\nतेरे दर पे आकर मिले परम विश्राम।"
          ],
          en: [
            "The Divine presence dwells in every single atom,\nWhoever holds pure devotion finds eternal peace.",
            "With faith in the soul and Your name on the lips,\nOne finds absolute tranquility at Your sanctuary."
          ]
        }
      },
      sad: {
        themeClass: "theme-sad",
        titles: { hi: "दर्द शायरी", en: "Heartbreak Poetry" },
        items: {
          hi: [
            "खामोशियों में भी एक गहरी आवाज़ होती है,\nहर मुस्कुराते चेहरे के पीछे कुछ बात होती है।",
            "वक़्त के साथ हर ज़ख्म भर जाता है,\nपर यादों का कारवां सदा साथ रहता है।"
          ],
          en: [
            "Even in silent moments, there lies a profound voice,\nBehind every smiling face, a hidden story remains.",
            "With passing time, every deep wound heals,\nYet the caravan of memories stays forever near."
          ]
        }
      }
    };

    let currentCategory = 'love';
    let currentSlideIndex = 0;

    // --- NATIVE 3D CARD ENGINE ---
    function renderWidget() {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const catData = poemsMultilingualData[currentCategory];
      const stage = document.getElementById('cardDeckStage');
      if (!stage || !catData) return;

      stage.innerHTML = '';

      const title = (catData.titles && catData.titles[currentLang]) ? catData.titles[currentLang] : catData.titles.hi;
      const items = (catData.items && catData.items[currentLang]) ? catData.items[currentLang] : catData.items.hi;

      const dict = (typeof translations !== 'undefined' && translations[currentLang]) 
        ? translations[currentLang] 
        : { btnSave: "🔖 सहेजें", btnShare: "🔗 साझा करें", btnComment: "💬 टिप्पणी" };

      const btnSaveText = dict.btnSave || "🔖 Save";
      const btnShareText = dict.btnShare || "🔗 Share";
      const btnCommentText = dict.btnComment || "💬 Comment";

      items.forEach((itemText, idx) => {
        const card = document.createElement('div');
        card.className = `custom-slide-card ${catData.themeClass}`;
        card.setAttribute('data-index', idx);
        card.onclick = () => {
          if (idx !== currentSlideIndex) {
            currentSlideIndex = idx;
            updateCardPositions();
          }
        };

        card.innerHTML = `
          <div class="card-top-bar">
            <div class="card-header-title">${title}</div>
            <button class="like-btn" onclick="handleProtectedLike(event, this)" title="Save to Liked">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </button>
          </div>

          <div class="shayari-content">${itemText}</div>

          <div class="action-bar">
            <button class="action-btn" onclick="handleSaveAction(event, '${btnSaveText}')">${btnSaveText}</button>
            <button class="action-btn" onclick="handleShareAction(event, '${btnShareText}')">${btnShareText}</button>
            <button class="action-btn" onclick="handleCommentAction(event, '${btnCommentText}')">${btnCommentText}</button>
          </div>
        `;
        stage.appendChild(card);
      });

      if (currentSlideIndex >= items.length) {
        currentSlideIndex = 0;
      }
      updateCardPositions();
    }

    function updateCardPositions() {
      const cards = document.querySelectorAll('.custom-slide-card');
      const total = cards.length;
      if (total === 0) return;

      cards.forEach((card, idx) => {
        card.classList.remove('active', 'prev', 'next', 'hidden-left', 'hidden-right');

        if (idx === currentSlideIndex) {
          card.classList.add('active');
        } else if (idx === (currentSlideIndex - 1 + total) % total && total > 1) {
          card.classList.add('prev');
        } else if (idx === (currentSlideIndex + 1) % total && total > 1) {
          card.classList.add('next');
        } else {
          if (idx < currentSlideIndex) {
            card.classList.add('hidden-left');
          } else {
            card.classList.add('hidden-right');
          }
        }
      });

      document.getElementById('counterText').innerText = `${currentSlideIndex + 1} / ${total}`;
    }

    function navigateDeck(dir) {
      const items = (poemsMultilingualData[currentCategory].items.hi) || [];
      const total = items.length;
      if (total <= 1) return;

      currentSlideIndex = (currentSlideIndex + dir + total) % total;
      updateCardPositions();
    }

    function selectCategory(catKey, el) {
      currentCategory = catKey;
      currentSlideIndex = 0;
      document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
      if (el) el.classList.add('active');
      renderWidget();
    }

    // --- PROTECTED INTERACTIONS ---
    function handleProtectedLike(e, btn) {
      e.stopPropagation();
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const msg = currentLang === 'hi' 
          ? 'कविता को पसंद/सहेजने के लिए कृपया पहले लॉगिन करें। क्या आप लॉगिन पृष्ठ पर जाना चाहते हैं?' 
          : 'Please log in to like and save this poem. Would you like to go to the login page?';
        
        if (confirm(msg)) {
          sessionStorage.setItem('redirectAfterLogin', window.location.href);
          window.location.href = 'login.html';
        }
        return;
      }
      btn.classList.toggle('liked');
    }

    function handleSaveAction(e, label) {
      e.stopPropagation();
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const msg = currentLang === 'hi' 
          ? 'कविता सहेजने के लिए कृपया पहले लॉगिन करें। क्या आप लॉगिन पृष्ठ पर जाना चाहते हैं?' 
          : 'Please log in to save items to your dashboard. Would you like to log in now?';
        
        if (confirm(msg)) {
          sessionStorage.setItem('redirectAfterLogin', window.location.href);
          window.location.href = 'login.html';
        }
        return;
      }
      alert(`${label} successfully!`);
    }

    function handleShareAction(e, label) {
      e.stopPropagation();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert('कविता का लिंक कॉपी हो गया है! (Link copied to clipboard!)');
      } else {
        alert(`${label} triggered!`);
      }
    }

    function handleCommentAction(e, label) {
      e.stopPropagation();
      alert('टिप्पणी अनुभाग जल्द ही आ रहा है! (Comments section opening soon!)');
    }

    // Dynamic Auth Header
    function renderAuthHeader() {
      const container = document.getElementById('userAuthContainer');
      if (!container) return;

      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      const currentLang = localStorage.getItem('site_lang') || 'hi';

      if (isLoggedIn) {
        const rawName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || 'Admin';
        const userName = rawName.trim();
        const userInitial = userName.charAt(0).toUpperCase() || 'A';

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn" onclick="toggleUserDropdown(event)">
            <span class="avatar-icon">${userInitial}</span>
            <span>${userName}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="profile.html" data-lang-key="myProfile">My Profile</a>
            <a href="saved-items.html" data-lang-key="savedItems">Saved Items</a>
            <a href="my-works.html" data-lang-key="myWorks">My Works</a>
            <a href="mailto:official.ksok@gmail.com" data-lang-key="contactUs">Contact us</a>
            <button onclick="handleUserLogout()" data-lang-key="logout">Logout</button>
          </div>
        `;
      } else {
        const guestLabel = currentLang === 'hi' ? 'अतिथि (Guest)' : 'Guest';
        const signInLabel = currentLang === 'hi' ? 'साइन इन करें' : 'Sign In';

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn" onclick="toggleUserDropdown(event)">
            <span class="avatar-icon guest-avatar">G</span>
            <span>${guestLabel}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="login.html" style="color:#d4a017; font-weight:600;">🔑 ${signInLabel}</a>
            <a href="mailto:official.ksok@gmail.com" data-lang-key="contactUs">Contact us</a>
          </div>
        `;
      }

      if (typeof translations !== 'undefined' && translations[currentLang]) {
        const dict = translations[currentLang];
        container.querySelectorAll('[data-lang-key]').forEach(el => {
          const key = el.getAttribute('data-lang-key');
          if (dict[key]) el.innerText = dict[key];
        });
      }
    }

    function toggleUserDropdown(event) {
      event.stopPropagation();
      const dropdown = document.getElementById('userDropdown');
      if (dropdown) dropdown.classList.toggle('show');
    }

    function handleUserLogout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userName');
      sessionStorage.clear();
      window.location.reload();
    }

    // UI Listeners
    window.addEventListener('click', (e) => {
      const userMenuBtn = document.getElementById('userMenuBtn');
      const userDropdown = document.getElementById('userDropdown');
      const otherLinksBtn = document.getElementById('otherLinksBtn');
      const socialPopup = document.getElementById('socialPopup');

      if (userDropdown && userMenuBtn && !userMenuBtn.contains(e.target)) {
        userDropdown.classList.remove('show');
      }

      if (otherLinksBtn && socialPopup && !otherLinksBtn.contains(e.target) && !socialPopup.contains(e.target)) {
        socialPopup.classList.remove('active');
        otherLinksBtn.classList.remove('active');
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
        otherLinksBtn.innerText = dict ? dict.otherLinks : 'Other Links';
      }
    });

    const otherLinksBtn = document.getElementById('otherLinksBtn');
    const socialPopup = document.getElementById('socialPopup');

    otherLinksBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isActive = socialPopup.classList.toggle('active');
      otherLinksBtn.classList.toggle('active');
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
      if (dict) {
        otherLinksBtn.innerText = isActive ? dict.close : dict.otherLinks;
      } else {
        otherLinksBtn.innerText = isActive ? '✕ Close' : 'Other Links';
      }
    });

    // Keyboard Arrow Navigation Support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') navigateDeck(-1);
      if (e.key === 'ArrowRight') navigateDeck(1);
    });

    window.addEventListener('languageChanged', () => {
      renderAuthHeader();
      renderWidget();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAuthHeader();
      renderWidget();
    });
  </script>

</body>
</html>
