<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नवीनतम पोस्ट (Latest Posts) - काव्य सागर और कहानी</title>

  <!-- Global Language Switcher Script -->
  <script src="lang.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d0d15;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      width: 100%;
    }

    /* ---------------- HEADER ---------------- */
    header {
      background: rgba(30, 30, 47, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4a017;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .brand svg { width: 28px; height: 28px; flex-shrink: 0; }

    nav { display: flex; gap: 20px; }
    nav a {
      color: #9ca3af; text-decoration: none; font-size: 0.95rem; transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: #d4a017; }

    /* Dual Language Dropdown */
    .lang-dropdown-wrapper { position: relative; margin-right: 12px; }
    .lang-select {
      background: rgba(255, 255, 255, 0.05); border: 1px solid #d4a017; color: #d4a017;
      padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; outline: none; transition: all 0.2s ease; appearance: none;
      -webkit-appearance: none; padding-right: 28px;
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23d4a017' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat; background-position: right 8px center;
    }
    .lang-select:hover { background-color: rgba(212, 160, 23, 0.15); }
    .lang-select option { background: #181824; color: #f3f4f6; }

    /* User Profile Menu */
    .user-profile-menu { position: relative; }
    .user-btn {
      display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 160, 23, 0.4); padding: 6px 12px; border-radius: 20px;
      color: #f3f4f6; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .user-btn:hover { background: rgba(212, 160, 23, 0.15); border-color: #d4a017; }
    .avatar-icon {
      width: 22px; height: 22px; background: #ffd700; color: #0d0d15; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75rem;
    }
    .avatar-icon.guest-avatar { background: #4b5563; color: #f3f4f6; }

    .dropdown-content {
      display: none; position: absolute; right: 0; top: 110%; background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; min-width: 150px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; z-index: 200;
    }
    .dropdown-content.show { display: block; }
    .dropdown-content a, .dropdown-content button {
      display: block; width: 100%; padding: 10px 14px; color: #d1d5db; text-decoration: none;
      background: none; border: none; text-align: left; font-size: 0.85rem; cursor: pointer;
    }
    .dropdown-content a:hover, .dropdown-content button:hover { background: rgba(212, 160, 23, 0.15); color: #d4a017; }

    /* ---------------- MAIN CONTAINER ---------------- */
    .latest-container {
      max-width: 1240px;
      margin: 35px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-main-title {
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 700;
    }

    .latest-card {
      width: 100%;
      background: #1e1e24;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      min-height: 550px;
    }

    .category-pills-header {
      background: #23232c;
      padding: 16px 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cat-pill {
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: #9ca3af;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .cat-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .cat-pill.active {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.25), rgba(184, 134, 11, 0.4));
      color: #ffd700;
      border-color: #d4a017;
      box-shadow: 0 4px 12px rgba(212, 160, 23, 0.2);
    }

    .latest-body {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      overflow: hidden;
    }

    .item-list-column {
      background: #181820;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      max-height: 480px;
    }

    .post-oval-item {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 35px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d1d5db;
    }

    .post-oval-item:hover {
      background: rgba(212, 160, 23, 0.1);
      border-color: rgba(212, 160, 23, 0.4);
      color: #ffffff;
      transform: translateX(4px);
    }

    .post-oval-item.active {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.2), rgba(120, 53, 15, 0.3));
      border-color: #d4a017;
      color: #ffd700;
      box-shadow: 0 4px 12px rgba(212, 160, 23, 0.15);
    }

    .item-title-text {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-column {
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #1b1b22;
      overflow-y: auto;
      position: relative;
    }

    .viewer-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .author-heading {
      font-size: 1.3rem;
      color: #ffd700;
      font-weight: 600;
    }

    .post-main-title {
      font-size: 1.15rem;
      color: #ffffff;
      margin-top: 4px;
    }

    .like-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 6px;
      transition: transform 0.2s;
    }
    .like-btn:hover { transform: scale(1.15); }
    .like-btn.liked svg { fill: #ff416c; stroke: #ff416c; color: #ff416c; }
    .like-btn svg {
      width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2;
    }

    .viewer-body-text {
      font-size: 1.1rem;
      line-height: 2;
      color: #d1d5db;
      white-space: pre-line;
      font-style: italic;
      background: rgba(255, 255, 255, 0.02);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 200px;
      margin-bottom: 25px;
      text-align: center;
    }

    /* ---------------- CLOUD COMMENT SECTION POPUP ---------------- */
    .comment-cloud-modal {
      display: none;
      position: absolute;
      bottom: 25px;
      right: 35px;
      width: 90%;
      max-width: 360px;
      background: #1e1e2d;
      border: 2px solid #d4a017;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      z-index: 50;
      animation: fadeInCloud 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .comment-cloud-modal.show { display: block; }
    @keyframes fadeInCloud {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .cloud-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px;
    }
    .cloud-header h4 { color: #d4a017; font-size: 0.88rem; }
    .cloud-close-btn { background: none; border: none; color: #9ca3af; font-size: 1rem; cursor: pointer; }
    .cloud-close-btn:hover { color: #ffffff; }
    .cloud-comments-list {
      max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; padding-right: 4px;
    }
    .comment-bubble { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 10px; border-radius: 12px; font-size: 0.78rem; }
    .comment-author { color: #d4a017; font-weight: 700; margin-bottom: 2px; font-size: 0.75rem; }
    .comment-text { color: #e5e7eb; }
    .cloud-input-group { display: flex; gap: 6px; }
    .cloud-input { flex: 1; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 10px; border-radius: 18px; color: #ffffff; font-size: 0.8rem; outline: none; }
    .cloud-input:focus { border-color: #d4a017; }
    .cloud-submit-btn { background: #d4a017; color: #0d0d15; border: none; padding: 6px 14px; border-radius: 18px; font-weight: 700; font-size: 0.78rem; cursor: pointer; }
    .cloud-submit-btn:hover { background: #b8860b; }

    .viewer-actions-bar {
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      flex-wrap: wrap;
    }

    .action-badge-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: rgba(212, 160, 23, 0.2);
      border-color: #d4a017;
      color: #ffffff;
    }

    /* ---------------- UNIVERSAL 4-CARD FOOTER ---------------- */
    .footer-section {
      max-width: 1240px; margin: 40px auto 0 auto; padding: 30px 20px 0 20px; width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .footer-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 20px; text-align: center; text-decoration: none; color: #d1d5db; font-weight: 600; font-size: 1rem; transition: transform 0.2s, border-color 0.2s, background 0.2s; display: flex; align-items: center; justify-content: center; min-height: 80px;
    }
    .footer-card:hover { transform: translateY(-4px); border-color: rgba(212, 160, 23, 0.4); background: rgba(212, 160, 23, 0.05); color: #ffffff; }

    .other-links-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
    .other-links-btn {
      width: 100%; height: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #d1d5db; font-weight: 600; font-size: 1rem; cursor: pointer; min-height: 80px; transition: all 0.2s;
    }
    .other-links-btn:hover, .other-links-btn.active { border-color: #d4a017; color: #d4a017; background: rgba(212, 160, 23, 0.08); }

    .social-popup {
      position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; pointer-events: none; z-index: 50;
    }
    .social-popup.active { pointer-events: auto; }
    .social-circle {
      width: 50px; height: 50px; border-radius: 50%; background: #181824; border: 2px solid rgba(255, 255, 255, 0.15); display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none; box-shadow: 0 10px 20px rgba(0,0,0,0.6); opacity: 0; transform: translateY(20px) scale(0.5); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .social-popup.active .social-circle { opacity: 1; transform: translateY(0) scale(1); }
    .social-popup.active .social-circle:nth-child(1) { transition-delay: 0.05s; }
    .social-popup.active .social-circle:nth-child(2) { transition-delay: 0.1s; }
    .social-popup.active .social-circle:nth-child(3) { transition-delay: 0.15s; }
    .social-circle.yt:hover { background: #ff0000; border-color: #ff0000; }
    .social-circle.fb:hover { background: #1877f2; border-color: #1877f2; }
    .social-circle.ig:hover { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-color: #e6683c; }
    .social-circle svg { width: 24px; height: 24px; fill: currentColor; }

    footer { text-align: center; padding: 30px 20px; color: #6b7280; font-size: 0.85rem; }

    @media (max-width: 900px) {
      .latest-body { grid-template-columns: 1fr; }
      .item-list-column { max-height: 220px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      header { padding: 10px 15px; } nav { display: none; }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <a href="home.html" class="brand">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 6C36 12 24 24 18 42L14 54l12-4c18-6 30-18 36-30-4 0-10 2-14 6" />
        <path d="M22 38l16-16" />
        <path d="M12 44c-3 1-6 4-6 7 0 4 4 7 8 7h14c6 0 10-4 12-8l4-8" stroke-width="1.8" />
        <path d="M18 42c0-2 2-4 4-4s4 2 4 4" stroke-width="1.8" />
      </svg>
      <span data-lang-key="brandTitle">काव्य सागर और कहानी</span>
    </a>

    <nav>
      <a href="home.html" data-lang-key="navHome">होम</a>
      <a href="poem.html" data-lang-key="navPoem">कविताएँ</a>
      <a href="stories.html" data-lang-key="navStory">कहानी</a>
      <a href="diaries.html" data-lang-key="navDiary">डायरी</a>
      <a href="quotes.html" data-lang-key="navInspiration">प्रेरणादायक बातें</a>
    </nav>

    <div style="display: flex; align-items: center;">
      <div class="lang-dropdown-wrapper">
        <select id="globalLangSelect" class="lang-select" onchange="applyLanguage(this.value)">
          <option value="hi">हिन्दी</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="user-profile-menu" id="userAuthContainer"></div>
    </div>
  </header>

  <!-- Main Latest Post Container -->
  <main class="latest-container">
    <h1 class="page-main-title" id="pageTitleHeading">नवीनतम पोस्ट (Latest Posts)</h1>

    <div class="latest-card">
      <!-- Top Category Pills Bar -->
      <div class="category-pills-header">
        <button class="cat-pill active" id="cat-kavita" onclick="switchCategory('kavita')">कविता (Poems)</button>
        <button class="cat-pill" id="cat-kahani" onclick="switchCategory('kahani')">कहानी (Stories)</button>
        <button class="cat-pill" id="cat-diary" onclick="switchCategory('diary')">डायरी (Diary)</button>
        <button class="cat-pill" id="cat-quotes" onclick="switchCategory('quotes')">प्रेरणादायक बातें (Quotes)</button>
      </div>

      <!-- Split Body Layout -->
      <div class="latest-body">
        <!-- Left Oval List Column -->
        <div class="item-list-column" id="itemListColumn"></div>

        <!-- Right Viewer Column -->
        <div class="viewer-column">
          <div class="viewer-top-row">
            <div>
              <div class="author-heading" id="viewAuthor">~ Author Name</div>
              <div class="post-main-title" id="viewTitle">Post Title</div>
            </div>
            <button class="like-btn" id="viewerLikeBtn" onclick="handleProtectedLike(this)" title="Like Post">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </button>
          </div>

          <div class="viewer-body-text" id="viewBody">Post content goes here...</div>

          <!-- Bottom Action Bar -->
          <div class="viewer-actions-bar">
            <button class="action-badge-btn" onclick="handleProtectedSave()">🔖 <span data-lang-key="btnSave">सहेजें (Save)</span></button>
            <button class="action-badge-btn" onclick="handleShareAction()">🔗 <span data-lang-key="btnShare">साझा करें (Share)</span></button>
            <button class="action-badge-btn" onclick="toggleCommentCloud(event)">💬 <span data-lang-key="btnComment">टिप्पणी (Comment)</span></button>
          </div>

          <!-- Cloud Shape Comment Section Popup -->
          <div class="comment-cloud-modal" id="latestCommentCloud" onclick="event.stopPropagation()">
            <div class="cloud-header">
              <h4>💬 पोस्ट चर्चा (Comments)</h4>
              <button class="cloud-close-btn" onclick="closeCommentCloud(event)">✕</button>
            </div>
            <div class="cloud-comments-list" id="latestCommentsList">
              <p style="font-size:0.78rem; color:#9ca3af; text-align:center;">लोड हो रहा है...</p>
            </div>
            <div class="cloud-input-group">
              <input type="text" class="cloud-input" id="latestCommentInput" placeholder="अपनी टिप्पणी लिखें...">
              <button class="cloud-submit-btn" onclick="postLatestComment(event)">भेजें</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Universal 4-Card Footer Section -->
  <section class="footer-section">
    <div class="footer-grid">
      <a href="about-us.html" class="footer-card" data-lang-key="aboutUs">About us</a>
      <a href="privacy-policy.html" class="footer-card" data-lang-key="privacyPolicy">Privacy Policy</a>
      <a href="terms.html" class="footer-card" data-lang-key="termsConditions">Terms and Conditions</a>

      <div class="other-links-wrapper">
        <button class="other-links-btn" id="otherLinksBtn" data-lang-key="otherLinks">Other Links</button>

        <div class="social-popup" id="socialPopup">
          <a href="https://www.youtube.com/@KavyaSagarorKahani" target="_blank" class="social-circle yt" title="YouTube">
            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </a>
          <a href="https://facebook.com" target="_blank" class="social-circle fb" title="Facebook">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <a href="https://instagram.com" target="_blank" class="social-circle ig" title="Instagram">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>

      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 काव्य सागर और कहानी. All rights reserved.
  </footer>

  <script type="module">
    import { db, collection, getDocs, setDoc, doc } from "./firebase.js";

    // --- 1. LOCAL TRANSLATION DICTIONARY ---
    const localDict = {
      hi: {
        pageTitleHeading: "नवीनतम पोस्ट (Latest Posts)",
        catKavita: "कविता (Poems)",
        catKahani: "कहानी (Stories)",
        catDiary: "डायरी (Diary)",
        catQuotes: "प्रेरणादायक बातें (Quotes)",
        btnSave: "सहेजें (Save)",
        btnShare: "साझा करें (Share)",
        btnComment: "टिप्पणी (Comment)"
      },
      en: {
        pageTitleHeading: "Latest Posts",
        catKavita: "Poems",
        catKahani: "Stories",
        catDiary: "Diary",
        catQuotes: "Quotes",
        btnSave: "Save",
        btnShare: "Share",
        btnComment: "Comment"
      }
    };

    let latestPostsDatabase = {
      kavita: [],
      kahani: [],
      diary: [],
      quotes: []
    };

    let activeCategory = 'kavita';
    let selectedPostId = null;
    const currentAuthorName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || 'Admin';

    // --- FETCH RECENT WORKS FROM FIREBASE (Within 2 Days / 48 Hours) ---
    async function loadLatestPostsFromCloud() {
      try {
        const querySnapshot = await getDocs(collection(db, "works"));
        const cloudPosts = { kavita: [], kahani: [], diary: [], quotes: [] };
        
        const now = Date.now();
        const twoDaysInMs = 2 * 24 * 60 * 60 * 1000;

        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          
          if (item.stage === 'published') {
            const itemTime = Number(item.id) || now;
            if ((now - itemTime) <= twoDaysInMs) {
              const mappedCat = mapCategoryToLatestTab(item.category);
              if (mappedCat && cloudPosts[mappedCat]) {
                cloudPosts[mappedCat].push({
                  id: docSnap.id,
                  title: item.title || 'Untitled',
                  author: `~ ${item.author || 'Admin'}`,
                  body: item.content || '',
                  subCategory: item.subCategory || ''
                });
              }
            }
          }
        });

        latestPostsDatabase = cloudPosts;
        renderPostList();
      } catch (error) {
        console.error("Error loading latest posts from cloud:", error);
        renderPostList();
      }
    }

    function mapCategoryToLatestTab(cat) {
      if (cat === 'kavita') return 'kavita';
      if (cat === 'kahani') return 'kahani';
      if (cat === 'diary') return 'diary';
      if (cat === 'prerna') return 'quotes';
      return 'kavita';
    }

    window.switchCategory = function(catKey) {
      activeCategory = catKey;
      selectedPostId = null;

      document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
      document.getElementById(`cat-${catKey}`).classList.add('active');

      renderPostList();
    }

    window.renderPostList = function() {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = localDict[currentLang] || localDict.hi;

      document.getElementById('pageTitleHeading').innerText = dict.pageTitleHeading;
      document.getElementById('cat-kavita').innerText = dict.catKavita;
      document.getElementById('cat-kahani').innerText = dict.catKahani;
      document.getElementById('cat-diary').innerText = dict.catDiary;
      document.getElementById('cat-quotes').innerText = dict.catQuotes;

      const posts = latestPostsDatabase[activeCategory] || [];
      const listContainer = document.getElementById('itemListColumn');
      listContainer.innerHTML = '';

      if (posts.length === 0) {
        listContainer.innerHTML = `<p style="color:#6b7280; font-size:0.85rem; text-align:center; padding:20px 5px;">No recent posts (last 2 days).</p>`;
        document.getElementById('viewAuthor').innerText = "~";
        document.getElementById('viewTitle').innerText = "No post selected";
        document.getElementById('viewBody').innerText = "There are no published posts within the last 48 hours in this category.";
        return;
      }

      if (!selectedPostId && posts.length > 0) {
        selectedPostId = posts[0].id;
      }

      posts.forEach(post => {
        const oval = document.createElement('div');
        oval.className = `post-oval-item ${post.id === selectedPostId ? 'active' : ''}`;
        oval.onclick = () => selectPost(post.id);

        oval.innerHTML = `
          <span class="item-title-text">${post.title}</span>
          <span style="color:#d4a017; font-size:0.8rem;">›</span>
        `;
        listContainer.appendChild(oval);
      });

      const currentPost = posts.find(p => p.id === selectedPostId) || posts[0];
      if (currentPost) {
        loadPostToViewer(currentPost);
      }
    }

    function selectPost(id) {
      selectedPostId = id;
      const posts = latestPostsDatabase[activeCategory] || [];
      const post = posts.find(p => p.id === id);

      document.querySelectorAll('.post-oval-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      if (post) {
        loadPostToViewer(post);
      }
    }

    function loadPostToViewer(post) {
      document.getElementById('viewAuthor').innerText = post.author;
      document.getElementById('viewTitle').innerText = post.title;
      document.getElementById('viewBody').innerText = post.body;
      document.getElementById('viewerLikeBtn').classList.remove('liked');
      loadLatestComments();
    }

    // --- CLOUD SAVE TO FIREBASE ---
    window.handleProtectedLike = async function(btn) {
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        alert('Please log in to like this post.');
        window.location.href = 'login.html';
        return;
      }
      btn.classList.toggle('liked');
      handleProtectedSave();
    }

    window.handleProtectedSave = async function() {
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        alert('Please log in to save items.');
        window.location.href = 'login.html';
        return;
      }

      const posts = latestPostsDatabase[activeCategory] || [];
      const post = posts.find(p => p.id === selectedPostId);
      if (!post) return;

      try {
        const saveId = 'saved_latest_' + post.id;
        const savedDoc = {
          id: saveId,
          user: currentAuthorName,
          category: activeCategory,
          title: post.title,
          body: post.body,
          pageUrl: 'latest.html',
          date: new Date().toLocaleDateString()
        };
        await setDoc(doc(db, "saved_items", saveId), savedDoc);
        alert("Post saved successfully to your Dashboard!");
      } catch (err) {
        console.error("Error saving latest post:", err);
      }
    }

    // --- CLOUD COMMENTS SECTION ---
    window.toggleCommentCloud = function(e) {
      e.stopPropagation();
      document.getElementById('latestCommentCloud').classList.toggle('show');
    }

    window.closeCommentCloud = function(e) {
      e.stopPropagation();
      document.getElementById('latestCommentCloud').classList.remove('show');
    }

    async function loadLatestComments() {
      if (!selectedPostId) return;
      const cardId = 'latest_' + selectedPostId;
      const listEl = document.getElementById('latestCommentsList');
      if (!listEl) return;

      try {
        const querySnapshot = await getDocs(collection(db, "comments"));
        let html = '';
        let count = 0;

        querySnapshot.forEach((docSnap) => {
          const c = docSnap.data();
          if (c.cardId === cardId) {
            count++;
            html += `
              <div class="comment-bubble">
                <div class="comment-author">${c.author}</div>
                <div class="comment-text">${c.text}</div>
              </div>
            `;
          }
        });

        listEl.innerHTML = count > 0 ? html : `<p style="font-size:0.78rem; color:#9ca3af; text-align:center;">कोई टिप्पणी नहीं है। पहली टिप्पणी लिखें!</p>`;
      } catch (err) {
        console.error("Error loading latest comments:", err);
      }
    }

    window.postLatestComment = async function(e) {
      e.stopPropagation();
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      if (!isLoggedIn) {
        alert("टिप्पणी करने के लिए कृपया पहले लॉगिन करें। (Please log in to comment.)");
        window.location.href = 'login.html';
        return;
      }

      const inputEl = document.getElementById('latestCommentInput');
      const text = inputEl.value.trim();
      if (!text || !selectedPostId) return;

      const cardId = 'latest_' + selectedPostId;
      const commentId = 'com_latest_' + Date.now();
      const newComment = {
        id: commentId,
        cardId: cardId,
        author: currentAuthorName,
        text: text,
        timestamp: new Date().toISOString()
      };

      try {
        await setDoc(doc(db, "comments", commentId), newComment);
        inputEl.value = '';
        loadLatestComments();
      } catch (err) {
        console.error("Error posting latest comment:", err);
        alert("Failed to post comment.");
      }
    }

    window.handleShareAction = function() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert('Post link copied to clipboard!');
      } else {
        alert('Share triggered!');
      }
    }

    // Footer popup listeners
    const otherLinksBtn = document.getElementById('otherLinksBtn');
    const socialPopup = document.getElementById('socialPopup');

    otherLinksBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isActive = socialPopup.classList.toggle('active');
      otherLinksBtn.classList.toggle('active');
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
      if (dict) {
        otherLinksBtn.innerText = isActive ? dict.close : dict.otherLinks;
      } else {
        otherLinksBtn.innerText = isActive ? '✕ Close' : 'Other Links';
      }
    });

    window.addEventListener('click', (e) => {
      const userDropdown = document.getElementById('userDropdown');
      const userMenuBtn = document.getElementById('userMenuBtn');
      if (userDropdown && userMenuBtn && !userMenuBtn.contains(e.target)) {
        userDropdown.classList.remove('show');
      }
      if (otherLinksBtn && socialPopup && !otherLinksBtn.contains(e.target) && !socialPopup.contains(e.target)) {
        socialPopup.classList.remove('active');
        otherLinksBtn.classList.remove('active');
      }
    });

    window.addEventListener('languageChanged', () => {
      renderAuthHeader();
      renderPostList();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAuthHeader();
      loadLatestPostsFromCloud();
    });
  </script>

</body>
