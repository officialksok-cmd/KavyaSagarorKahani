<script type="module">
    import { db, collection, getDocs } from "./firebase.js";

    // --- 1. LOCAL BILINGUAL DICTIONARY FOR HOME ---
    const homeDictionary = {
      hi: {
        heroGreeting: "नमस्ते, {user}!",
        heroDescription: "काव्य और कहानियों के इस अनूठे संगम में आपका स्वागत है। यहाँ अपनी पसंदीदा रचनाएँ पढ़ें और नया लेखन लिखें।",
        sectionTitle: "त्वरित विकल्प (Quick Links)",
        card1Title: "नवीन पोस्ट (New Posts)",
        card1Desc: "मंच पर साझा की गई नवीनतम कविताएँ, कहानियाँ, डायरी और प्रेरणादायक विचार देखें।",
        card1Link: "नवीनतम पोस्ट देखें →",
        card2Title: "नया लिखें (Create New)",
        card2Desc: "अपनी खुद की कविता, कहानी, डायरी या प्रेरक विचार यहाँ लिखें और समुदाय के साथ साझा करें।",
        card2Link: "रचना जोड़ें →"
      },
      en: {
        heroGreeting: "Welcome, {user}!",
        heroDescription: "Welcome to this serene universe of poetry and storytelling. Read inspiring works and write your own creations.",
        sectionTitle: "Quick Links",
        card1Title: "New Posts",
        card1Desc: "Explore the latest poems, stories, diaries, and inspirational thoughts shared across the platform.",
        card1Link: "View New Posts →",
        card2Title: "Create New",
        card2Desc: "Draft your own poems, stories, diaries, or quotes to share with the community.",
        card2Link: "Write Now →"
      }
    };

    let allWorksData = [];

    async function loadWorksForSearch() {
      try {
        const querySnapshot = await getDocs(collection(db, "works"));
        allWorksData = [];
        querySnapshot.forEach(docSnap => {
          allWorksData.push({ id: docSnap.id, ...docSnap.data() });
        });
      } catch (err) {
        console.error("Error loading works for search:", err);
      }
    }

    // --- ACTIVE SEARCH MATRIX WITH REDIRECTION ---
    window.handleGlobalSearch = function(query) {
      const section = document.getElementById('searchResultsSection');
      const tbody = document.getElementById('matrixTableBody');
      tbody.innerHTML = '';

      if (!query || query.trim() === '') {
        section.classList.remove('show');
        return;
      }

      section.classList.add('show');
      const q = query.toLowerCase();

      const matrixMap = {};
      allWorksData.forEach(w => {
        const author = w.author || 'Admin';
        if (!matrixMap[author]) matrixMap[author] = { user: author, kavita: [], kahani: [], diary: [], quotes: [] };
        
        const cat = w.category;
        if (cat === 'kavita') matrixMap[author].kavita.push(w);
        else if (cat === 'kahani') matrixMap[author].kahani.push(w);
        else if (cat === 'diary') matrixMap[author].diary.push(w);
        else if (cat === 'prerna') matrixMap[author].quotes.push(w);
      });

      let matchCount = 0;
      Object.values(matrixMap).forEach(row => {
        const userMatch = row.user.toLowerCase().includes(q);
        const kavitaMatch = row.kavita.some(w => w.title.toLowerCase().includes(q));
        const kahaniMatch = row.kahani.some(w => w.title.toLowerCase().includes(q));
        const diaryMatch = row.diary.some(w => w.title.toLowerCase().includes(q));
        const quotesMatch = row.quotes.some(w => w.title.toLowerCase().includes(q));

        if (userMatch || kavitaMatch || kahaniMatch || diaryMatch || quotesMatch) {
          matchCount++;
          const tr = document.createElement('tr');
          
          const formatCell = (worksList, targetPage) => {
            if (worksList.length === 0) return '-';
            return worksList.map(w => `<span style="cursor:pointer; color:#d4a017; text-decoration:underline;" onclick="window.location.href='${targetPage}'">${w.title}</span>`).join(', ');
          };

          tr.innerHTML = `
            <td><strong>${row.user}</strong></td>
            <td>${formatCell(row.kavita, 'poem.html')}</td>
            <td>${formatCell(row.kahani, 'stories.html')}</td>
            <td>${formatCell(row.diary, 'diaries.html')}</td>
            <td>${formatCell(row.quotes, 'quotes.html')}</td>
          `;
          tbody.appendChild(tr);
        }
      });

      if (matchCount === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7280; padding:15px;">No matches found for "${query}".</td></tr>`;
      }
    }

    function renderHomePageContent() {
      const currentLang = localStorage.getItem('site_lang') || 'hi';
      const dict = homeDictionary[currentLang] || homeDictionary.hi;

      const userName = localStorage.getItem('userName') || 'Admin';
      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      const userDisplay = isLoggedIn ? userName : (currentLang === 'hi' ? 'अतिथि पाठक' : 'Guest Reader');

      document.getElementById('heroGreeting').innerText = dict.heroGreeting.replace('{user}', userDisplay);
      document.getElementById('heroDescription').innerText = dict.heroDescription;
      document.getElementById('sectionTitle').innerText = dict.sectionTitle;

      document.getElementById('card1Title').innerText = dict.card1Title;
      document.getElementById('card1Desc').innerText = dict.card1Desc;
      document.getElementById('card1Link').innerText = dict.card1Link;

      document.getElementById('card2Title').innerText = dict.card2Title;
      document.getElementById('card2Desc').innerText = dict.card2Desc;
      document.getElementById('card2Link').innerText = dict.card2Link;
    }

    // --- 2. DYNAMIC AUTH HEADER ---
    function renderAuthHeader() {
      const container = document.getElementById('userAuthContainer');
      if (!container) return;

      const isLoggedIn = (localStorage.getItem('isLoggedIn') === 'true') || (sessionStorage.getItem('isLoggedIn') === 'true');
      const currentLang = localStorage.getItem('site_lang') || 'hi';

      const myProfileLabel = currentLang === 'hi' ? 'मेरी प्रोफाइल (My Account)' : 'My Account';
      const savedItemsLabel = currentLang === 'hi' ? 'सहेजी गई रचनाएँ' : 'Saved Items';
      const myWorksLabel = currentLang === 'hi' ? 'मेरी रचनाएँ' : 'My Works';
      const contactUsLabel = currentLang === 'hi' ? 'संपर्क करें' : 'Contact Us';
      const logoutLabel = currentLang === 'hi' ? 'लॉग आउट' : 'Logout';

      if (isLoggedIn) {
        const rawName = localStorage.getItem('userName') || sessionStorage.getItem('userName') || 'Admin';
        const userName = rawName.trim();
        const userInitial = userName.charAt(0).toUpperCase() || 'A';
        const isAdmin = (userName.toLowerCase() === 'admin');

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn">
            <span class="avatar-icon">${userInitial}</span>
            <span>${userName}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="profile.html">${myProfileLabel}</a>
            <a href="saved-items.html">${savedItemsLabel}</a>
            <a href="my-work.html">${myWorksLabel}</a>
            ${isAdmin ? `<a href="admin-control.html" style="color: #ffd700; font-weight: bold;">⚡ Master Panel</a>` : ''}
            <a href="mailto:official.ksok@gmail.com">${contactUsLabel}</a>
            <button onclick="handleUserLogout()">${logoutLabel}</button>
          </div>
        `;
      } else {
        const guestLabel = currentLang === 'hi' ? 'अतिथि (Guest)' : 'Guest';
        const signInLabel = currentLang === 'hi' ? 'साइन इन करें' : 'Sign In';

        container.innerHTML = `
          <button class="user-btn" id="userMenuBtn">
            <span class="avatar-icon guest-avatar">G</span>
            <span>${guestLabel}</span>
            <small>▼</small>
          </button>
          <div class="dropdown-content" id="userDropdown">
            <a href="login.html" style="color:#d4a017; font-weight:600;">🔑 ${signInLabel}</a>
            <a href="mailto:official.ksok@gmail.com">${contactUsLabel}</a>
          </div>
        `;
      }
    }

    function handleUserLogout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('userName');
      sessionStorage.clear();
      window.location.reload();
    }

    // --- 3. ROBUST GLOBAL EVENT LISTENERS (DELEGATION) ---
    window.addEventListener('click', (e) => {
      const userMenuBtn = document.getElementById('userMenuBtn');
      const userDropdown = document.getElementById('userDropdown');
      
      // If clicking the profile button, toggle the dropdown
      if (userMenuBtn && (userMenuBtn === e.target || userMenuBtn.contains(e.target))) {
        e.stopPropagation();
        if (userDropdown) {
          userDropdown.classList.toggle('show');
        }
        return;
      }

      // If clicking outside the dropdown, close it
      if (userDropdown && userMenuBtn && !userMenuBtn.contains(e.target)) {
        userDropdown.classList.remove('show');
      }

      // Footer Other Links popup logic
      const otherLinksBtn = document.getElementById('otherLinksBtn');
      const socialPopup = document.getElementById('socialPopup');
      if (otherLinksBtn && socialPopup && !otherLinksBtn.contains(e.target) && !socialPopup.contains(e.target)) {
        socialPopup.classList.remove('active');
        otherLinksBtn.classList.remove('active');
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
        otherLinksBtn.innerText = dict ? dict.otherLinks : 'Other Links';
      }
    });

    const otherLinksBtn = document.getElementById('otherLinksBtn');
    const socialPopup = document.getElementById('socialPopup');

    if (otherLinksBtn && socialPopup) {
      otherLinksBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isActive = socialPopup.classList.toggle('active');
        otherLinksBtn.classList.toggle('active');
        const currentLang = localStorage.getItem('site_lang') || 'hi';
        const dict = (typeof translations !== 'undefined') ? translations[currentLang] : null;
        if (dict) {
          otherLinksBtn.innerText = isActive ? dict.close : dict.otherLinks;
        } else {
          otherLinksBtn.innerText = isActive ? '✕ Close' : 'Other Links';
        }
      });
    }

    window.addEventListener('languageChanged', () => {
      renderAuthHeader();
      renderHomePageContent();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderAuthHeader();
      renderHomePageContent();
      loadWorksForSearch();
    });
  </script>
